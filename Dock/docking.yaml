amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    robot_model_type: "differential"
    
    # Particle Filter Parameters
    min_particles: 500
    max_particles: 3000
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    
    # Laser Parameters
    scan_topic: "scan"
    laser_max_range: 12.0 # Increased slightly for better localization
    
    # Update frequency
    update_min_d: 0.1
    update_min_a: 0.1